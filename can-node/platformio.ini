; Husky701 CAN node - LilyGO T-CAN485 (CH9102F USB variant, LilyGO option Q331)
;
; Reads the bike's CAN bus in listen-only mode and sends telemetry frames to the
; dash over RS-485.
;
; Same platform version as the dash project, so both use Arduino-ESP32 2.0.17.

[platformio]
default_envs = node
; Optional, untracked: secrets.ini holds the OTA password (copy secrets.example.ini).
extra_configs = secrets*.ini

; Overridden by secrets.ini. Empty = this firmware refuses update mode.
[secrets]
ota_password =

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Bigger app slots (2 x 1.9 MB) so Wi-Fi + BLE fit and an OTA image has room.
; Changing the partition table needs one USB upload; after that, OTA works.
board_build.partitions = min_spiffs.csv
upload_speed = 921600
; Fast enough for the raw CAN log (see README). The CH9102F handles this rate.
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3    ; BLE link to the Android dash

; ---------------------------------------------------------------------------
; node - the real firmware.
; ---------------------------------------------------------------------------
[env:node]

; ---------------------------------------------------------------------------
; node_ota - the same firmware, uploaded over Wi-Fi. Tap NODE UPDATE on the
; phone's Diagnostics page (engine off). The node joins the Wi-Fi set on the
; phone (home Wi-Fi, or the phone hotspot); with this computer on the same
; network:  pio run -e node_ota -t upload
; If husky701-node.local doesn't resolve, add  --upload-port <IP shown in the app>.
; The node connects back to this computer on host_port, so allow it through the
; firewall (see README, "Over-the-air updates").
; ---------------------------------------------------------------------------
[env:node_ota]
extends = env:node
upload_protocol = espota
upload_port = husky701-node.local
upload_flags =
    --auth=${secrets.ota_password}
    --host_port=32323

; ---------------------------------------------------------------------------
; selftest - no bike needed. Feeds made-up CAN frames through the real decoder
; and sends the result over RS-485, to test the link to the dash on the bench.
; The CAN controller is not started in this build.
; ---------------------------------------------------------------------------
[env:selftest]
build_flags =
    ${env.build_flags}
    -DSELFTEST=1

; ---------------------------------------------------------------------------
; node_debug - the node firmware with the ESP32 core's own log (Wi-Fi, BLE)
; on USB serial. For chasing connection problems on the bench.
; ---------------------------------------------------------------------------
[env:node_debug]
build_flags =
    ${env.build_flags}
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=4
