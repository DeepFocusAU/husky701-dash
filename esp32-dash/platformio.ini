; Husky701 dash - LilyGO T-Display-S3 (ESP32-S3, 1.9" 170x320 ST7789, 8-bit parallel)
;
; Draws tacho / gear / coolant / battery from telemetry frames. Build 'sim'
; (default) runs on simulated data with no other hardware; build 'live' reads
; frames from the under-seat CAN node over RS-485 (MAX3485 on the dash side).
;
; Platform is pinned to espressif32 6.9.0 (Arduino-ESP32 core 2.0.17), which
; TFT_eSPI 2.5.x supports on the ESP32-S3 parallel bus. Newer core 3.x builds
; are known to break TFT_eSPI, so don't bump this without testing.

[platformio]
default_envs = sim

; ---------------------------------------------------------------------------
; Shared settings for both builds
; ---------------------------------------------------------------------------
[env]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; The S3's native USB won't enter the bootloader with the default DTR/RTS
; reset while the app is running; usb_reset works, and watchdog_reset is
; needed afterwards or the chip stays in download mode (black screen).
; (watchdog_reset needs esptool >= 4.6; the platform bundles 4.5.1.)
platform_packages =
    platformio/tool-esptoolpy@2.40900.250804
upload_flags =
    --before=usb_reset
    --after=watchdog_reset

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.3    ; tyre pressure sensors (passive BLE scan)

custom_common_flags =
    -DCORE_DEBUG_LEVEL=1
    ; ---- TFT_eSPI configuration for T-Display-S3 (equivalent of Setup206) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

; ---------------------------------------------------------------------------
; sim  - DEFAULT. Built-in simulator feeds the display; no MAX3485 needed.
;        2 taps on the Diagnostics page switch to SIM-LOOP (jumper GPIO17->GPIO18) or LIVE.
; ---------------------------------------------------------------------------
[env:sim]
build_flags = ${env.custom_common_flags}
    -DSIM_MODE_DEFAULT=1

; ---------------------------------------------------------------------------
; live - real data from the CAN node over RS-485 (MAX3485 RO -> GPIO18).
; ---------------------------------------------------------------------------
[env:live]
build_flags = ${env.custom_common_flags}
    -DSIM_MODE_DEFAULT=0
